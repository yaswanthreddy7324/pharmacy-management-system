{% extends "base.html" %}
{% block title %}{{ code }}{% endblock %}
{% block content %}
<div class="label-card card" style="max-width: 480px; margin-top: 60px; text-align: center; padding: 40px;">
  <span style="font-family: var(--font-display); font-size: 40px; color: var(--accent);">℞</span>
  <h1 style="margin-top: 12px;">{{ code }}</h1>
  <p class="muted">{{ message }}</p>
  <a href="{{ url_for('dashboard') }}" class="btn btn-primary" style="margin-top: 12px;">Back to Overview</a>
</div>
{% endblock %}
